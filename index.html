<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Index Login — Thin Stripe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e73ff">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #2454e0;
      --primary-dark: #1c3fb8;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1c2333;
      --muted: #697184;
      --border: #e3e7f0;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: 'Segoe UI', Inter, sans-serif;
      padding: 16px;
    }

    .login-card {
      width: 300px;
      max-width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 0 20px;
      box-shadow: 0 8px 22px rgba(28, 35, 51, .1);
      animation: fade .4s ease;
      overflow: hidden;
    }

    .login-card form {
      padding: 0 24px
    }

    .banner {
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #5b7cf0);
      position: relative;
      margin-bottom: 0;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px) }
      to { opacity: 1; transform: translateY(0) }
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
      margin-top: 18px
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      box-shadow: 0 5px 12px rgba(36, 84, 224, .28);
    }

    .logo-badge svg { width: 18px; height: 18px }
    .logo-badge svg path, .logo-badge svg rect { stroke: #fff !important }

    .logo-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: .2px
    }

    .logo-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px
    }

    label.field-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
      margin-left: 2px
    }

    .field-group {
      display: flex;
      margin-bottom: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      transition: border-color .2s, box-shadow .2s;
    }

    .field-group:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 84, 224, .12)
    }

    .field-group .icon {
      background: #eef1f8;
      color: var(--primary);
      width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .field-group input {
      flex: 1;
      padding: 7px 9px;
      border: none;
      outline: none;
      font-size: 12.5px;
      color: var(--text);
      background: #fff;
    }

    .pw-wrap { position: relative; flex: 1; display: flex }

    .pw-wrap input {
      flex: 1;
      padding: 7px 32px 7px 9px;
      border: none;
      outline: none;
      font-size: 12.5px;
      color: var(--text);
      background: #fff
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px
    }

    .eye-btn:hover { color: var(--primary) }

    .eye-btn:focus-visible,
    input:focus-visible,
    .login-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    .opts-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 11px
    }

    .opts-row label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      cursor: pointer;
      user-select: none
    }

    .opts-row input[type=checkbox] {
      accent-color: var(--primary);
      width: 12px;
      height: 12px
    }

    .forgot-lnk {
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      background: none;
      border: none;
      font-size: 13px;
      padding: 0
    }

    .forgot-lnk:hover { text-decoration: underline }

    .login-btn {
      width: 100%;
      padding: 9px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background .2s, box-shadow .2s, transform .1s;
    }

    .login-btn:hover:not(:disabled) {
      background: var(--primary-dark);
      box-shadow: 0 8px 20px rgba(36, 84, 224, .32)
    }

    .login-btn:active:not(:disabled) { transform: scale(.97) }
    .login-btn:disabled { cursor: not-allowed; opacity: .85 }

    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .35);
      transform: scale(0);
      animation: rpl .55s linear;
      pointer-events: none
    }

    @keyframes rpl { to { transform: scale(4); opacity: 0 } }

    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
      flex-shrink: 0
    }

    @keyframes spin { to { transform: rotate(360deg) } }

    .login-btn.success {
      background: var(--success);
      box-shadow: 0 8px 20px rgba(22, 163, 74, .32)
    }

    .login-btn.success .btn-inner { animation: popIn .3s ease }

    @keyframes popIn {
      0% { transform: scale(.8) }
      60% { transform: scale(1.1) }
      100% { transform: scale(1) }
    }

    .login-btn.error {
      background: var(--danger);
      box-shadow: 0 8px 20px rgba(220, 38, 38, .32)
    }

    .login-btn.shake { animation: shake .4s ease }

    @keyframes shake {
      0%, 100% { transform: translateX(0) }
      20% { transform: translateX(-7px) }
      40% { transform: translateX(7px) }
      60% { transform: translateX(-4px) }
      80% { transform: translateX(4px) }
    }

    #toastBox {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 9999
    }

    .toast-msg {
      background: #1c2333;
      color: #fff;
      padding: 10px 16px;
      border-radius: 9px;
      margin-top: 8px;
      font-size: 13px;
      min-width: 190px;
      animation: tsl .3s ease
    }

    .toast-msg.is-error { background: #7a2020 }

    @keyframes tsl {
      from { transform: translateX(80px); opacity: 0 }
      to { transform: translateX(0); opacity: 1 }
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      justify-content: center;
      align-items: center;
      z-index: 999
    }

    .overlay.open { display: flex }

    .modal-card {
      width: 310px;
      background: #fff;
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .2);
      animation: fade .3s ease
    }

    .modal-card h5 {
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 15px
    }

    .modal-card .modal-sub {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin: 0 0 16px
    }

    .modal-card .field-group { margin-bottom: 12px }
    .modal-card .field-group input { padding: 9px 12px }
    .modal-card .field-group .icon { width: 38px; font-size: 13px }

    .mbtns { display: flex; gap: 8px; margin-top: 4px }

    .mbtns button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer
    }

    .mbtn-cancel {
      background: #fff;
      border: 1.5px solid var(--border);
      color: var(--text)
    }

    .mbtn-cancel:hover { background: #f8fafc }

    .mbtn-submit {
      background: var(--primary);
      border: none;
      color: #fff
    }

    .mbtn-submit:hover { background: var(--primary-dark) }

    /* NEW: Create Account line below the Login button (view only, no click action) */
    .card-footer {
      padding: 0 24px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .card-footer .footer-text {
      font-size: 11.5px;
      color: var(--muted);
    }

    .create-acc-lnk {
      color: var(--primary);
      font-weight: 700;
      font-size: 11.5px;
      margin-left: 4px;
    }

    /* CHANGE: mobile sizing — bigger card, bigger text/tap targets on small screens */
    @media (max-width: 480px) {
      .login-card {
        width: 100%;
        max-width: 380px;
        border-radius: 18px;
      }

      .login-card form { padding: 0 26px }

      .logo-badge { width: 46px; height: 46px; }
      .logo-badge svg { width: 22px; height: 22px }
      .logo-title { font-size: 18px; }
      .logo-sub { font-size: 12px; }
      label.field-label { font-size: 11.5px; }
      .field-group { margin-bottom: 13px; }
      .field-group .icon { width: 38px; font-size: 14px; }

      .field-group input,
      .pw-wrap input {
        padding: 12px 12px;
        font-size: 15px;
      }

      .pw-wrap input { padding-right: 38px; }

      .opts-row { font-size: 13px; margin-bottom: 18px; }
      .forgot-lnk { font-size: 14px; }

      .login-btn {
        padding: 13px;
        font-size: 15px;
        border-radius: 10px;
      }

      .card-footer {
        padding: 0 26px;
        margin-top: 20px;
        padding-top: 16px;
      }

      .card-footer .footer-text,
      .create-acc-lnk {
        font-size: 13.5px;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * { animation: none !important; transition: none !important }
    }
  </style>

</head>

<body>
  <div id="toastBox" role="status" aria-live="polite"></div>
  <div class="login-card">
    <div class="banner"></div>
    <div class="logo-wrap">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="9" width="18" height="11" rx="1.5" stroke="#fff" stroke-width="1.6" />
          <path d="M3 9L12 4L21 9" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="logo-title">Log In</div>
      <div class="logo-sub">Material Location Access Portal</div>
    </div>
    <form id="loginForm" novalidate>
      <label class="field-label" for="loginUsername">User ID</label>
      <div class="field-group">
        <span class="icon"><i class="fa fa-id-badge" aria-hidden="true"></i></span>
        <input id="loginUsername" placeholder="User ID" maxlength="6" autocomplete="username">
      </div>
      <label class="field-label" for="loginPassword">Password</label>
      <div class="field-group">
        <span class="icon"><i class="fa fa-lock" aria-hidden="true"></i></span>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Show or hide password">
            <i class="fa fa-eye" id="eyeIcon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="opts-row">
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
        <button type="button" class="forgot-lnk" onclick="openForgot()">Forgot Password?</button>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <div class="btn-inner" id="btnInner">
          <div class="btn-spinner" id="btnSpinner"></div>
          <span id="btnText"><i class="fa fa-sign-in-alt" style="margin-right:7px" aria-hidden="true"></i>Login</span>
        </div>
      </button>
    </form>
    <div class="card-footer">
      <span class="footer-text">New here?</span>
      <span class="create-acc-lnk">Create Account</span>
    </div>
  </div>

  <div class="overlay" id="forgotOverlay" role="dialog" aria-modal="true" aria-labelledby="fpTitle">
    <div class="modal-card">
      <h5 id="fpTitle"><i class="fa fa-key" style="color:var(--primary)" aria-hidden="true"></i> Reset Password</h5>
      <p class="modal-sub">Enter your employee ID and a new password</p>
      <div class="field-group">
        <span class="icon"><i class="fa fa-id-badge" aria-hidden="true"></i></span>
        <input id="fpUser" placeholder="6 Digit Employee ID" maxlength="6">
      </div>
      <div class="field-group">
        <span class="icon"><i class="fa fa-lock" aria-hidden="true"></i></span>
        <input type="password" id="fpNew" placeholder="New Password">
      </div>
      <div class="field-group">
        <span class="icon"><i class="fa fa-check" aria-hidden="true"></i></span>
        <input type="password" id="fpConfirm" placeholder="Confirm Password">
      </div>
      <div class="mbtns">
        <button class="mbtn-cancel" onclick="closeForgot()">Cancel</button>
        <button class="mbtn-submit" onclick="resetPassword()">Submit</button>
      </div>
    </div>
  </div>

    <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8A7xKZp4xXXooDJxPjNKqrnjmFcfjXaIlLBE9WmrTHwV_r04GTW2j0lU9b3ueKWjcdQ/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const su = localStorage.getItem('si_savedUser');
      const sp = localStorage.getItem('si_savedPass');
      if (su) {document.getElementById('loginUsername').value = su; document.getElementById('rememberMe').checked = true;}
      if (sp) {document.getElementById('loginPassword').value = sp;}
    });

    function toast(msg, isError) {
      const box = document.getElementById('toastBox');
      const d = document.createElement('div');
      d.className = 'toast-msg' + (isError ? ' is-error' : '');
      d.innerText = msg;
      box.appendChild(d); setTimeout(() => d.remove(), 3000);
    }
    function togglePassword() {
      const inp = document.getElementById('loginPassword');
      const ic = document.getElementById('eyeIcon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      ic.className = inp.type === 'text' ? 'fa fa-eye-slash' : 'fa fa-eye';
    }
    function addRipple(btn, e) {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const sz = Math.max(rect.width, rect.height) * 2;
      const x = (e.clientX || rect.left + rect.width / 2) - rect.left - sz / 2;
      const y = (e.clientY || rect.top + rect.height / 2) - rect.top - sz / 2;
      r.style.cssText = `width:${sz}px;height:${sz}px;left:${x}px;top:${y}px`;
      btn.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }
    function setLoading(on) {
      document.getElementById('btnSpinner').style.display = on ? 'block' : 'none';
      document.getElementById('btnText').style.display = on ? 'none' : 'block';
      document.getElementById('loginBtn').disabled = on;
    }
    function setSuccess() {
      const btn = document.getElementById('loginBtn');
      document.getElementById('btnSpinner').style.display = 'none';
      document.getElementById('btnText').innerHTML = '<i class="fa fa-check-circle" style="margin-right:7px" aria-hidden="true"></i>Success!';
      document.getElementById('btnText').style.display = 'block';
      btn.classList.add('success');
    }
    function setError() {
      const btn = document.getElementById('loginBtn');
      document.getElementById('btnSpinner').style.display = 'none';
      document.getElementById('btnText').innerHTML = '<i class="fa fa-times-circle" style="margin-right:7px" aria-hidden="true"></i>Wrong id or password';
      document.getElementById('btnText').style.display = 'block';
      btn.classList.add('error', 'shake');
      btn.disabled = false;
      setTimeout(() => {
        btn.classList.remove('error', 'shake');
        document.getElementById('btnText').innerHTML = '<i class="fa fa-sign-in-alt" style="margin-right:7px" aria-hidden="true"></i>Login';
      }, 2200);
    }
    document.getElementById('loginForm').addEventListener('submit', login);
    async function login(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      addRipple(btn, e);
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value;
      const rem = document.getElementById('rememberMe').checked;
      if (!u || !p) {
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 500);
        toast('Fill id and password', true);
        return;
      }
      setLoading(true);
      try {
        const res = await fetch(`${WEB_APP_URL}?action=login&Username=${encodeURIComponent(u)}&Password=${encodeURIComponent(p)}`);
        const data = await res.json();
        if (data.status === 'success') {
          if (rem) {localStorage.setItem('si_savedUser', u); localStorage.setItem('si_savedPass', p);}
          else {localStorage.removeItem('si_savedUser'); localStorage.removeItem('si_savedPass');}
          sessionStorage.setItem('loggedIn', 'true');
          sessionStorage.setItem('userName', data.name);
          setSuccess();
          setTimeout(() => location.href = 'Indexing.html', 1200);
        } else {
          setError();
        }
      } catch (err) {
        setError();
        toast('Network error — Try again later', true);
      }
    }
    function openForgot() {document.getElementById('forgotOverlay').classList.add('open'); document.getElementById('fpUser').focus();}
    function closeForgot() {
      document.getElementById('forgotOverlay').classList.remove('open');
      ['fpUser', 'fpNew', 'fpConfirm'].forEach(id => document.getElementById(id).value = '');
    }
    document.getElementById('forgotOverlay').addEventListener('click', (e) => {if (e.target.id === 'forgotOverlay') closeForgot();});
    async function resetPassword() {
      const u = document.getElementById('fpUser').value.trim();
      const n = document.getElementById('fpNew').value;
      const c = document.getElementById('fpConfirm').value;
      if (!u) {toast('Fill employee id', true); return;}
      if (n.length < 4) {toast('Password should be 4+ characters', true); return;}
      if (n !== c) {toast('Passwords do not match', true); return;}
      try {
        const res = await fetch(`${WEB_APP_URL}?action=resetPassword&Username=${encodeURIComponent(u)}&NewPassword=${encodeURIComponent(n)}`);
        const data = await res.json();
        if (data.status === 'success') {
          toast('Password updated successfully!');
          closeForgot();
        } else {toast('Failed — Check Employee ID', true);}
      } catch (e) {toast('Network error', true);}
    }
  </script>
</body>

</html>
